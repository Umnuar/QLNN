name: Build QLNN-Client

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: QLNN-Client

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: npm install

    - name: TypeScript Check & Vite Build
      run: npm run build:vite

    - name: Build Electron App (.exe)
      run: npm run build:win
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: QLNN-Client-Windows
        path: |
          QLNN-Client/release/*.exe
          QLNN-Client/dist/*.exe

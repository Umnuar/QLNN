name: CI & Build Pipeline

on:
  push:
    branches: [ "main", "sec/hardening" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: QLNN-Backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'QLNN-Backend/package-lock.json'

      - name: Install Dependencies (Deterministic SLSA)
        run: npm ci

      - name: TypeScript Type Check
        run: npx tsc --noEmit

  client-build:
    runs-on: windows-latest
    needs: [backend-check]
    defaults:
      run:
        working-directory: QLNN-Client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'QLNN-Client/package-lock.json'

      - name: Install Dependencies (Deterministic SLSA)
        run: npm ci

      - name: Run Client Unit Tests
        run: npm test -- --run

      - name: TypeScript Check & Vite Build
        run: npm run build:vite

      - name: Build Electron App (.exe)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QLNN-Client-Windows
          path: |
            QLNN-Client/release/*.exe
            QLNN-Client/dist/*.exe

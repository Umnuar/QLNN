[package]
name = "quan-ly-nong-nghiep"
version = "1.0.0"
description = "QLNN - Quan Ly Nong Nghiep & Nong Thon Moi Xa Dak Ha"
authors = ["UBND Xa Dak Ha"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tauri-plugin-http = "2"
